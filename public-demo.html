<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>L100 Contacts (Demo – use full app for Neon)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ═══════════════════════════════════════════════════
    // CONFIG – replace with your Supabase values
    // ═══════════════════════════════════════════════════
    const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    const ADMIN_PASSWORD = 'l100admin';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── VCF helper ──
    function generateVCF(contacts) {
      return contacts.map(c => {
        const name = (c.full_name || '').trim();
        const phone = (c.whatsapp || '').trim();
        return [
          'BEGIN:VCARD',
          'VERSION:3.0',
          `FN:${name}`,
          `N:${name};;;;`,
          `TEL;TYPE=CELL,WHATSAPP:${phone}`,
          `ORG:L100`,
          `NOTE:L100 · ${phone}`,
          'CATEGORIES:L100,Classmate',
          'END:VCARD'
        ].join('\r\n');
      }).join('\r\n');
    }

    function downloadVCF(contacts) {
      const blob = new Blob([generateVCF(contacts)], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `L100_Contacts_${contacts.length}.vcf`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ── Icons (simple SVG) ──
    const Icon = ({ d, size = 18, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d={d} />
      </svg>
    );

    // ── Public Form ──
    function Home({ onAdmin }) {
      const [fullName, setFullName] = useState('');
      const [whatsapp, setWhatsapp] = useState('');
      const [status, setStatus] = useState('idle');
      const [errorMsg, setErrorMsg] = useState('');

      const normalizePhone = (phone) =>
        phone.trim().replace(/\s+/g, '').replace(/^\+233/, '0');

      const handleSubmit = async (e) => {
        e.preventDefault();
        const name = fullName.trim();
        const phone = normalizePhone(whatsapp);
        if (!name || !phone) return;
        setStatus('loading');
        setErrorMsg('');
        try {
          // Duplicate check: phone (exact) + name (case-insensitive)
          const [phoneRes, nameRes] = await Promise.all([
            supabase.from('contacts').select('id, full_name, whatsapp').eq('whatsapp', phone).limit(1),
            supabase.from('contacts').select('id, full_name, whatsapp').ilike('full_name', name).limit(1),
          ]);
          if (phoneRes.error) throw phoneRes.error;
          if (nameRes.error) throw nameRes.error;

          const phoneMatch = phoneRes.data?.[0];
          const nameMatch = nameRes.data?.[0];

          if (phoneMatch && nameMatch && phoneMatch.id === nameMatch.id) {
            throw new Error('This name and number are already registered.');
          }
          if (phoneMatch) {
            throw new Error('This WhatsApp number is already registered under "' + phoneMatch.full_name + '".');
          }
          if (nameMatch) {
            throw new Error('The name "' + name + '" is already registered with a different number.');
          }

          const { error } = await supabase.from('contacts').insert({
            full_name: name,
            whatsapp: phone,
            level: 'L100'
          });
          if (error) throw error;
          setStatus('success');
          setFullName('');
          setWhatsapp('');
        } catch (err) {
          setStatus('error');
          setErrorMsg(err.message || 'Could not save. Check Supabase setup in the code.');
        }
      };

      if (status === 'success') {
        return (
          <div className="max-w-md mx-auto">
            <div className="bg-white rounded-2xl border border-emerald-200 p-8 text-center shadow-sm">
              <div className="mx-auto mb-4 w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center text-3xl">✓</div>
              <h2 className="text-xl font-bold text-slate-900">Submitted!</h2>
              <p className="mt-2 text-slate-600">Your contact has been recorded.</p>
              <button onClick={() => setStatus('idle')} className="mt-6 w-full rounded-xl bg-indigo-600 py-3 text-sm font-semibold text-white hover:bg-indigo-700">
                Submit another
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto">
          <div className="text-center mb-8">
            <div className="mx-auto mb-4 w-14 h-14 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl shadow-lg shadow-indigo-200">🎓</div>
            <h1 className="text-2xl font-bold text-slate-900">L100 Contact Form</h1>
            <p className="mt-2 text-slate-500 text-sm">Register so classmates & class leaders can reach you.</p>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1.5">Full Name <span className="text-red-500">*</span></label>
                <input type="text" value={fullName} onChange={e => setFullName(e.target.value)} required placeholder="e.g. Ama Serwaa Mensah"
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 px-4 text-sm outline-none focus:border-indigo-400 focus:bg-white focus:ring-2 focus:ring-indigo-100" />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1.5">WhatsApp Number <span className="text-red-500">*</span></label>
                <input type="tel" value={whatsapp} onChange={e => setWhatsapp(e.target.value)} required placeholder="e.g. 0244123456"
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 px-4 text-sm outline-none focus:border-indigo-400 focus:bg-white focus:ring-2 focus:ring-indigo-100" />
                <p className="mt-1.5 text-xs text-slate-400">Number linked to your WhatsApp</p>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1.5">Level</label>
                <input type="text" value="L100" disabled className="w-full rounded-xl border border-slate-200 bg-slate-100 py-3 px-4 text-sm font-medium text-slate-600 cursor-not-allowed" />
              </div>
              {status === 'error' && (
                <div className="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{errorMsg}</div>
              )}
              <button type="submit" disabled={status === 'loading'}
                className="w-full rounded-xl bg-indigo-600 py-3.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 disabled:opacity-60">
                {status === 'loading' ? 'Checking…' : 'Submit Contact'}
              </button>
            </form>
          </div>
          <p className="mt-6 text-center text-xs text-slate-400">Details only visible to authorised admins.</p>
          <button onClick={onAdmin} className="mt-4 mx-auto block text-xs text-slate-400 underline">Admin login</button>
        </div>
      );
    }

    // ── Admin ──
    function Admin({ onBack }) {
      const [auth, setAuth] = useState(false);
      const [pwd, setPwd] = useState('');
      const [contacts, setContacts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [editingId, setEditingId] = useState(null);
      const [editForm, setEditForm] = useState({ full_name: '', whatsapp: '' });
      const [search, setSearch] = useState('');

      const fetchContacts = useCallback(async () => {
        setLoading(true);
        setError('');
        try {
          const { data, error: err } = await supabase
            .from('contacts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(10);
          if (err) throw err;
          setContacts(data || []);
        } catch (err) {
          setError(err.message || 'Failed to load');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { if (auth) fetchContacts(); }, [auth, fetchContacts]);

      const login = (e) => {
        e.preventDefault();
        if (pwd === ADMIN_PASSWORD) { setAuth(true); setPwd(''); setError(''); }
        else setError('Incorrect password');
      };

      const saveEdit = async (id) => {
        try {
          const { error: err } = await supabase.from('contacts').update({
            full_name: editForm.full_name.trim(),
            whatsapp: editForm.whatsapp.trim().replace(/\s+/g, '')
          }).eq('id', id);
          if (err) throw err;
          setEditingId(null);
          fetchContacts();
        } catch (err) { alert('Update failed: ' + err.message); }
      };

      const filtered = contacts.filter(c =>
        c.full_name.toLowerCase().includes(search.toLowerCase()) || c.whatsapp.includes(search)
      );

      if (!auth) {
        return (
          <div className="max-w-sm mx-auto">
            <div className="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
              <div className="text-center mb-6">
                <div className="mx-auto mb-3 w-12 h-12 rounded-xl bg-slate-900 text-white flex items-center justify-center text-xl">🔒</div>
                <h1 className="text-xl font-bold">Admin Access</h1>
                <p className="text-sm text-slate-500 mt-1">Enter password to continue</p>
              </div>
              <form onSubmit={login} className="space-y-4">
                <input type="password" value={pwd} onChange={e => { setPwd(e.target.value); setError(''); }} placeholder="Password" autoFocus
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100" />
                {error && <p className="text-center text-sm text-red-600">{error}</p>}
                <button type="submit" className="w-full rounded-xl bg-slate-900 py-3 text-sm font-semibold text-white hover:bg-slate-800">Enter Dashboard</button>
              </form>
              <button onClick={onBack} className="mt-4 w-full text-center text-xs text-slate-400 underline">← Back to form</button>
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
              <h1 className="text-xl font-bold text-slate-900">Admin Dashboard</h1>
              <p className="text-sm text-slate-500">Last 10 entries · Only admin can download VCF</p>
            </div>
            <div className="flex gap-2">
              <button onClick={fetchContacts} className="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Refresh</button>
              <button onClick={() => downloadVCF(contacts)} disabled={!contacts.length}
                className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 disabled:opacity-50">
                Download VCF
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-6">
            <div className="rounded-xl border border-slate-200 bg-white p-4">
              <p className="text-xs text-slate-500">Showing</p>
              <p className="text-2xl font-bold">{contacts.length}</p>
            </div>
            <div className="rounded-xl border border-slate-200 bg-white p-4">
              <p className="text-xs text-slate-500">Export ready</p>
              <p className="text-2xl font-bold text-indigo-600">{contacts.length ? 'Yes' : '—'}</p>
            </div>
          </div>

          <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search name or number…"
            className="w-full mb-4 rounded-xl border border-slate-200 bg-white py-2.5 px-4 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100" />

          {error && <div className="mb-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{error}</div>}

          <div className="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            {loading && !contacts.length ? (
              <div className="py-16 text-center text-slate-400">Loading…</div>
            ) : filtered.length === 0 ? (
              <div className="py-16 text-center text-slate-400">No contacts yet.</div>
            ) : (
              <ul className="divide-y divide-slate-100">
                {filtered.map(c => (
                  <li key={c.id} className="px-4 py-3.5 sm:px-5">
                    {editingId === c.id ? (
                      <div className="flex flex-col sm:flex-row gap-2">
                        <input value={editForm.full_name} onChange={e => setEditForm(f => ({...f, full_name: e.target.value}))}
                          className="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Name" />
                        <input value={editForm.whatsapp} onChange={e => setEditForm(f => ({...f, whatsapp: e.target.value}))}
                          className="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="WhatsApp" />
                        <div className="flex gap-1.5">
                          <button onClick={() => saveEdit(c.id)} className="rounded-lg bg-emerald-600 px-3 py-2 text-white text-sm">Save</button>
                          <button onClick={() => setEditingId(null)} className="rounded-lg bg-slate-100 px-3 py-2 text-sm">Cancel</button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <p className="font-medium text-slate-900 truncate">{c.full_name}</p>
                          <p className="text-sm text-slate-500">L100 · {c.whatsapp}</p>
                        </div>
                        <button onClick={() => { setEditingId(c.id); setEditForm({ full_name: c.full_name, whatsapp: c.whatsapp }); }}
                          className="text-slate-400 hover:text-slate-700 text-sm px-2 py-1">Edit</button>
                      </div>
                    )}
                  </li>
                ))}
              </ul>
            )}
          </div>
          <p className="mt-4 text-center text-xs text-slate-400">VCF = Full Name + L100 + number</p>
          <button onClick={onBack} className="mt-4 mx-auto block text-xs text-slate-400 underline">← Back to form</button>
        </div>
      );
    }

    // ── App shell ──
    function App() {
      const [page, setPage] = useState('home');
      return (
        <div>
          <header className="sticky top-0 z-40 border-b border-slate-200/80 bg-white/80 backdrop-blur-md">
            <div className="max-w-3xl mx-auto flex items-center justify-between px-4 py-3">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-sm">📱</div>
                <div>
                  <p className="text-sm font-bold text-slate-900 leading-tight">L100 Contacts</p>
                  <p className="text-[11px] text-slate-500">College Registration</p>
                </div>
              </div>
              <button onClick={() => setPage(page === 'admin' ? 'home' : 'admin')}
                className="rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-200">
                {page === 'admin' ? 'Public Form' : 'Admin'}
              </button>
            </div>
          </header>
          <main className="max-w-3xl mx-auto px-4 py-8">
            {page === 'home' ? <Home onAdmin={() => setPage('admin')} /> : <Admin onBack={() => setPage('home')} />}
          </main>
          <footer className="pb-8 text-center text-xs text-slate-400">L100 Contact Collection</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
